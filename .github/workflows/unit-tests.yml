# Fuehrt die Unit-Tests nach erfolgreichem Build-Workflow aus.
name: Unit Tests

run-name: Unit Tests after build by ${{ github.actor }}

on:
  # Dieser Workflow startet automatisch, wenn der Build-Workflow abgeschlossen ist.
  workflow_run:
    workflows:
      - Build Frontend and Backend
    types:
      - completed
    branches:
      - main

  # Erlaubt zusätzlich einen manuellen Start über GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read

# Wenn mehrere neue Commits kurz nacheinander gepusht werden, wird nur der neueste Testlauf behalten.
concurrency:
  group: unit-tests-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  # Job fuer die Frontend-Tests.
  frontend-test:
    name: Test Frontend

    # Bei automatischem Start soll nur nach einem erfolgreichen Build getestet werden.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      # Holt den Repository-Stand, der im Build-Workflow getestet wurde.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Richtet Node.js fuer die Jest-Tests ein.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Installiert die Frontend-Abhaengigkeiten exakt anhand der Lock-Datei.
      - name: Install frontend dependencies
        run: npm ci

      # Fuehrt die Jest-Tests aus.
      # --runInBand verhindert parallele Testausfuehrung und macht die Ausgabe reproduzierbarer.
      - name: Run frontend tests
        run: npm test -- --runInBand

  # Job fuer die Backend-Tests.
  backend-test:
    name: Test Backend

    # Bei automatischem Start soll nur nach einem erfolgreichen Build getestet werden.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: backend

    steps:
      # Holt den Repository-Stand, der im Build-Workflow getestet wurde.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # Richtet Java fuer die JUnit-Tests ein.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Fuehrt die JUnit-Tests des Backends aus.
      - name: Run backend tests
        run: mvn -B test
